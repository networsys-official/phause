name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phause
      NEXT_PUBLIC_SITE_URL: https://phause.com
      NEXT_PUBLIC_PLANS_API_URL: https://phishingsimulation.webandappdevelopmenttech.com/api/plans

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phause
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        env:
          AUTH_SECRET: ci-build-only-not-for-runtime
        run: npm run build

  deploy:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/phause_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/phause_deploy" "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/phause_deploy" \
            -p "${VPS_SSH_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' && git fetch origin main && git checkout -f -B main origin/main && set -e; if [ ! -f .env.production ]; then echo 'ERROR: .env.production is missing on the server. Add it before deploying.' >&2; exit 1; fi; if ! grep -Eq '^NEXT_PUBLIC_PLANS_API_URL=https://[^[:space:]#]+/api/plans/?$' .env.production; then echo 'ERROR: NEXT_PUBLIC_PLANS_API_URL must contain the full HTTPS /api/plans endpoint in .env.production.' >&2; exit 1; fi; docker compose --env-file .env.production --profile migrate run --build --rm migrator sh -lc 'npx prisma migrate deploy && npm run prisma:seed && npx tsx src/features/cms/content-patches.ts' && docker compose --env-file .env.production up -d --build --remove-orphans"
