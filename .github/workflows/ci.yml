name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phause
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d phause"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write root environment file
        env:
          POSTGRES_USER_VALUE: postgres
          POSTGRES_PASSWORD_VALUE: postgres
          POSTGRES_DB_VALUE: phause
          AUTH_SECRET_VALUE: ${{ secrets.AUTH_SECRET || 'ci-build-only-not-for-runtime' }}
          BOOTSTRAP_ADMIN_PASSWORD_VALUE: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD || 'ci-bootstrap-password' }}
          NEXT_PUBLIC_SITE_URL_VALUE: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://phause.com' }}
          NEXT_PUBLIC_PLANS_API_URL_VALUE: ${{ vars.NEXT_PUBLIC_PLANS_API_URL || 'https://phishingsimulation.webandappdevelopmenttech.com/api/plans' }}
        run: |
          POSTGRES_PASSWORD_URLENCODED=$(node -e 'console.log(encodeURIComponent(process.env.POSTGRES_PASSWORD_VALUE))')
          cat > .env <<ENV_EOF
          POSTGRES_USER=$POSTGRES_USER_VALUE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD_VALUE
          POSTGRES_DB=$POSTGRES_DB_VALUE
          DATABASE_URL="postgresql://$POSTGRES_USER_VALUE:$POSTGRES_PASSWORD_URLENCODED@localhost:5432/$POSTGRES_DB_VALUE?schema=public"
          AUTH_SECRET="$AUTH_SECRET_VALUE"
          AUTH_URL="$NEXT_PUBLIC_SITE_URL_VALUE"
          NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL_VALUE"
          APP_PORT=3000
          BOOTSTRAP_ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD_VALUE"
          NEXT_PUBLIC_PLANS_API_URL="$NEXT_PUBLIC_PLANS_API_URL_VALUE"
          ENV_EOF
          chmod 600 .env
          if [[ ! "$NEXT_PUBLIC_PLANS_API_URL_VALUE" =~ ^https://[^[:space:]#]+/api/plans/?$ ]]; then
            echo "Invalid NEXT_PUBLIC_PLANS_API_URL: it must be a full HTTPS URL ending in /api/plans." >&2
            exit 1
          fi

      - name: Mask and inspect database URL components
        env:
          POSTGRES_PASSWORD_VALUE: postgres
        run: |
          echo "::add-mask::$POSTGRES_PASSWORD_VALUE"
          node <<'NODE'
          const fs = require('fs');
          const env = fs.readFileSync('.env', 'utf8');
          const match = env.match(/^DATABASE_URL="?([^"\n]+)"?$/m);
          if (!match) throw new Error('DATABASE_URL is missing from .env');
          const url = new URL(match[1]);
          console.log(`DATABASE_URL user=${url.username} host=${url.hostname} port=${url.port || '5432'} database=${url.pathname.slice(1)} password=<hidden>`);
          NODE

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        env:
          AUTH_SECRET: ci-build-only-not-for-runtime
        run: npm run build

  deploy:
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/phause_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/phause_deploy" "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/phause_deploy" \
            -p "${VPS_SSH_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' && git fetch origin main && git checkout -f -B main origin/main && set -e; if [ ! -f .env ]; then echo 'ERROR: .env is missing on the server. Add it before deploying.' >&2; exit 1; fi; if ! grep -Eq '^NEXT_PUBLIC_PLANS_API_URL=https://[^[:space:]#]+/api/plans/?$' .env; then echo 'ERROR: NEXT_PUBLIC_PLANS_API_URL is missing or invalid; configure a full HTTPS URL ending in /api/plans in the root .env file.' >&2; exit 1; fi; docker compose --env-file .env --profile migrate run --build --rm migrator sh -lc 'npx prisma migrate deploy && npm run prisma:seed && npx tsx src/features/cms/content-patches.ts' && docker compose --env-file .env up -d --build --remove-orphans"
